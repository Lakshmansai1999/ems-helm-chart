apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ems
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Lakshmansai1999/ems-helm-chart.git
    targetRevision: master
    path: springboot

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
