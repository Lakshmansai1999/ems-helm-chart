replicaCount: 1

image:
  repository: lakshmansai/springboot-app
  pullPolicy: IfNotPresent
  tag: "30"

service:
  type: NodePort
  port: 8080
  nodePort: 32456

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Database configuration
# Set postgres.enabled=true to deploy PostgreSQL in cluster
# Set postgres.enabled=false to use external database
postgres:
  enabled: false

# Database credentials will be read from existing Kubernetes Secret and ConfigMap
# Create them manually before deploying:
# kubectl create secret generic db-secret --from-literal=DB_PASSWORD=<your-password>
# kubectl create configmap db-config --from-literal=DB_URL=<jdbc-url> --from-literal=DB_USERNAME=<username>
database:
  useExistingSecret: true
  secretName: db-secret
  configMapName: db-config
